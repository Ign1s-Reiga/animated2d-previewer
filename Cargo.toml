[workspace]
resolver = "2"
members = [
    "crates/a2d-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
a2d-core    = { path = "crates/a2d-core" }

thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["preserve_order"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
